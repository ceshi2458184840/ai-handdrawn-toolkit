name: pencil_sketch
description: Pencil sketch with graphite shading
positive:
  - pencil sketch
  - graphite shading
  - sketchy lines
  - beige paper texture
  - natural hand pressure
  - varied line weight
  - construction lines visible
negative:
  - photorealistic
  - 3d
  - CGI
  - anime
  - manga
  - glossy digital art
  - perfect geometric lines
  - hyper detailed
  - cinematic lighting
  - complex background
recommended:
  aspect_ratio: "16:9"
  default_width: 1536
  default_height: 1024
