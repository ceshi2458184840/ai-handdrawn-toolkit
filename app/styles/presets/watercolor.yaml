id: watercolor
name: Watercolor
description: Soft watercolor wash illustration
medium:
  primary: watercolor
  secondary: ink line
line_priority: medium
color_mode: full_color
shading:
  type: wash
  max_strength: 0.8
paper:
  type: cold_press
  grain: visible
preferred:
  - watercolor wash
  - soft edges
  - pigment
  - paper bleed
  - light sketchy line under drawing
forbidden:
  - photorealistic
  - 3d render
  - CGI
  - anime
  - manga
  - glossy digital art
  - perfect geometric lines
  - hyper detailed
  - cinematic lighting
  - busy background
recommended:
  aspect_ratio: "16:9"
  default_width: 1536
  default_height: 1024
