id: doodle
name: Doodle
description: Casual friendly doodle style
medium:
  primary: marker or pen
  secondary: none
line_priority: high
color_mode: limited_color
shading:
  type: none
  max_strength: 0.0
paper:
  type: notebook
  grain: subtle
preferred:
  - casual marker
  - loose simplified shapes
  - friendly doodle
  - simple lines
  - playful composition
forbidden:
  - photorealistic
  - 3d render
  - CGI
  - anime
  - manga
  - glossy digital art
  - perfect geometric lines
  - hyper detailed
  - cinematic lighting
  - busy background
  - intentionally ugly
  - messy scribble
recommended:
  aspect_ratio: "16:9"
  default_width: 1536
  default_height: 1024
