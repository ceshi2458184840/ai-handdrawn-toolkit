id: ink_sketch
name: Ink Sketch
description: Black ink line drawing with clean strokes
medium:
  primary: black ink
  secondary: none
line_priority: high
color_mode: monochrome
shading:
  type: sparse_hatching
  max_strength: 0.3
paper:
  type: white
  grain: none
preferred:
  - fine ink
  - black line
  - confident contour
  - variable stroke width
  - sparse hatching
  - white paper
forbidden:
  - watercolor
  - oil painting
  - storybook
  - photorealistic
  - 3d render
  - glossy digital art
  - anime
  - manga
  - cinematic lighting
  - excessive texture
  - busy background
recommended:
  aspect_ratio: "16:9"
  default_width: 1536
  default_height: 1024
