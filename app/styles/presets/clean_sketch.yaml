id: clean_sketch
name: Clean Sketch
description: Clean educational hand-drawn sketch
medium:
  primary: graphite pencil
  secondary: fine black ink
line_priority: high
color_mode: monochrome
shading:
  type: restrained_hatching
  max_strength: 0.35
paper:
  type: off_white
  grain: subtle
preferred:
  - competent human drawing
  - confident contour
  - natural line weight
  - slight pen pressure variation
  - simple readable silhouette
  - sparse construction lines
  - clean negative space
forbidden:
  - watercolor
  - oil painting
  - storybook illustration
  - photorealistic
  - 3d render
  - glossy digital art
  - anime
  - manga
  - cinematic lighting
  - excessive texture
  - busy background
recommended:
  aspect_ratio: "16:9"
  default_width: 1536
  default_height: 1024
