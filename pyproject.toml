[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-handdrawn-toolkit"
version = "0.1.0"
description = "Multi-provider hand-drawn style image generation CLI and Agent skill."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
ai-handdrawn = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
