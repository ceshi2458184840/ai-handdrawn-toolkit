[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-handdrawn-toolkit"
version = "0.2.0"
description = "Production-ready AI Handdrawn Toolkit — CLI, MCP & Agent Skill"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ceshi2458184840", email = "poncianopadolcg658@gmail.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]
vector = [
    "vtracer>=0.6.0",
]

[project.scripts]
ai-handdrawn-toolkit = "ai_handdrawn_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]